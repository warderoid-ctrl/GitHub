name: ESP32_Plotter_Controller_RevB_Emerald_Dingo
board: Emerald Dingo (RevB)

kinematics:
  CoreXY:

stepping:
  engine: RMT
  idle_ms: 255
  dir_delay_us: 0
  pulse_us: 3
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: gpio.2
  x:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 500.000
    max_travel_mm: 300.000
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0.000
      positive_direction: false
      settle_ms: 250.000
      seek_mm_per_min: 800.000
      feed_mm_per_min: 200.000
      seek_scaler: 5
      feed_scaler: 5
    motor0:
      limit_all_pin: gpio.34
      hard_limits: false
      tmc_2130:
        direction_pin: gpio.26:low
        step_pin: gpio.25
        run_amps: 0.5
        hold_amps: 0.125
        microsteps: 16
        stallguard: 13
        stallguard_debug: false
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        r_sense_ohms: 0.110
        cs_pin: gpio.17
    motor1:
      null_motor:
  y:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 6000.000
    acceleration_mm_per_sec2: 500.000
    max_travel_mm: 300.000
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0.000
      positive_direction: false
      settle_ms: 250.000
      seek_mm_per_min: 800.000
      feed_mm_per_min: 200.000
      seek_scaler: 5
      feed_scaler: 5
    motor0:
      limit_all_pin: gpio.35
      hard_limits: false
      tmc_2130:
        direction_pin: gpio.33:low
        step_pin: gpio.32
        run_amps: 0.5
        hold_amps: 0.125
        microsteps: 16
        stallguard: 13
        stallguard_debug: false
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        r_sense_ohms: 0.110
        cs_pin: gpio.16
    motor1:
      null_motor:
  z:
    steps_per_mm: 70
    max_rate_mm_per_min: 6000
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 24
    soft_limits: false
    homing:
      cycle: 0
      mpos_mm: 24
      positive_direction: true
      settle_ms: 250
      seek_mm_per_min: 300
      feed_mm_per_min: 200
      seek_scaler: 1.1
      feed_scaler: 1.5

    motor0:
      limit_pos_pin: gpio.13:low:pu
      hard_limits: false
      pulloff_mm: 2
      tmc_2130:
        direction_pin: gpio.21
        step_pin: gpio.22
        cs_pin: gpio.4
        r_sense_ohms: 0.11
        run_amps: 0.5
        hold_amps: 0.2
        microsteps: 16
        stallguard: 43
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        spi_index: -1
    motor1:
      null_motor:

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5

control:
  reset_pin: gpio.0:low:pu

coolant:
  delay_ms: 1000.000

probe:
  check_mode_start: false

macros:
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3:

start:
  must_home: false
  check_limits: true
  deactivate_parking: false

user_outputs:



# This uses the hardware solenoid controller board (DRV120 driver based) as a spindle
# and is controlled with M3 Snnn commands (e.g. M3S0 = `off` and `M3S1` = on).
# This config may or may not work with the FET board and may or may not cause damage so
# use at your own risk.
relay:
  direction_pin: NO_PIN
  output_pin: gpio.27:low
  enable_pin: NO_PIN
  disable_with_s0: true
  s0_with_disable: true
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.0% 1=100.0%
  off_on_alarm: false

arc_tolerance_mm: 0.002
junction_deviation_mm: 0.010
verbose_errors: false
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
