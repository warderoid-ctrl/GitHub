name: ESP32_Plotter_Controller_RevB_Emerald_Dingo
board: Emerald Dingo (RevB)

kinematics:
  CoreXY:

stepping:
  engine: RMT
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 3
  disable_delay_us: 0
axes:
  shared_stepper_disable_pin: gpio.2
  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 6000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 300
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      settle_ms: 250
      seek_mm_per_min: 800
      feed_mm_per_min: 200
      seek_scaler: 5
      feed_scaler: 5
    motor0:
      limit_neg_pin: gpio.34
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      tmc_2130:
        direction_pin: gpio.26:low
        step_pin: gpio.25
        cs_pin: gpio.17
        r_sense_ohms: 0.11
        run_amps: 0.5
        hold_amps: 0.125
        microsteps: 16
        stallguard: 13
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        spi_index: -1
    motor1:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 6000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 300
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      settle_ms: 250
      seek_mm_per_min: 800
      feed_mm_per_min: 200
      seek_scaler: 5
      feed_scaler: 5
    motor0:
      limit_neg_pin: gpio.35
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      tmc_2130:
        direction_pin: gpio.33:low
        step_pin: gpio.32
        cs_pin: gpio.16
        r_sense_ohms: 0.11
        run_amps: 0.5
        hold_amps: 0.125
        microsteps: 16
        stallguard: 13
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
        spi_index: -1
    motor1:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
  z:
    steps_per_mm: 200.000
    max_rate_mm_per_min: 31000.000
    acceleration_mm_per_sec2: 20000.000
    max_travel_mm: 24.000
    soft_limits: false
    homing:
      cycle: 1
      mpos_mm: 12.000
      positive_direction: true
      settle_ms: 250.000
      seek_mm_per_min: 2000.000
      feed_mm_per_min: 200.000
      seek_scaler: 1.100
      feed_scaler: 5.000

    motor0:
      # This uses FluidNCs internal software driver for solenoids.
      # It should be used with the FET driver board and NOT the
      # DRV120 based version. Using this config with the DRV120
      # will quickly cause ireperable damage to the driver board.
      # As this is considered an axis, it is controlled with
      # Z axis commands e.g. `G1 Z0` = off, `G1 Z10` = on etc.
      solenoid:
        output_pin: gpio.27
        pwm_hz: 30000
        off_percent: 0.000
        pull_percent: 100.000
        hold_percent: 50.000
        pull_ms: 2000
        direction_invert: false
    motor1:
      null_motor:

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.5

control:
  reset_pin: gpio.0:low:pu

coolant:
  delay_ms: 1000.000

probe:
  check_mode_start: false

macros:
  startup_line0: G0Z1F1000
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3:
  after_reset:
  after_unlock:

start:
  must_home: false
  check_limits: false
  deactivate_parking: false

user_outputs:
  analog0_pin: gpio.13:high
  analog0_hz: 35000

uart1:
  txd_pin: gpio.21
  rxd_pin: gpio.22
  baud: 115200
  mode: 8N1

uart_channel1:
  uart_num: 1
  report_interval_ms: 500

arc_tolerance_mm: 0.002
junction_deviation_mm: 0.010
verbose_errors: false
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
